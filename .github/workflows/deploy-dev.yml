# ============================================================================
# deploy-dev.yml - Development Environment Deployment
# ============================================================================
# Deploys to the "dev" environment when code is pushed to the dev branch.
# Uses a Firebase CI token for authentication.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_TOKEN                    — Run `firebase login:ci` locally and paste the output
#   FIREBASE_PROJECT_ID               — Your Firebase project ID
#   VITE_API_URL                      — Live Cloud Functions API URL
#   VITE_FIREBASE_API_KEY             — Firebase client API key
#   VITE_FIREBASE_AUTH_DOMAIN         — Firebase auth domain
#   VITE_FIREBASE_STORAGE_BUCKET      — Firebase storage bucket
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
# ============================================================================

name: Deploy to Dev

# ============================================================================
# TRIGGERS
# ============================================================================
on:
  push:
    branches:
      - dev
  workflow_dispatch:

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8'
  # Force development mode so pnpm installs devDependencies.
  # This environment defaults NODE_ENV to production which causes pnpm to
  # skip devDependencies, breaking TypeScript compilation.
  NODE_ENV: development

# ============================================================================
# CONCURRENCY
# ============================================================================
concurrency:
  group: deploy-dev
  cancel-in-progress: false

# ============================================================================
# JOBS
# ============================================================================
jobs:
  deploy:
    name: Build and Deploy to Dev
    runs-on: ubuntu-latest

    permissions:
      contents: read # Required to checkout repo

    # ========================================================================
    # ENVIRONMENT
    # ========================================================================
    environment:
      name: dev
      url: https://health-lifeline-53fb3.web.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # NODE_ENV=development is set at the job level so pnpm installs
      # devDependencies (TypeScript, build tools, etc.)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ======================================================================
      # Deploy to Firebase
      # Authenticates using FIREBASE_TOKEN — no GCP IAM setup needed.
      # NODE_ENV=development is inherited from the job env so the firebase.json
      # predeploy scripts (pnpm --filter shared build, pnpm --filter functions
      # build, predeploy.mjs) run correctly.
      # ======================================================================
      - name: Deploy Firestore rules and indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          firebase deploy --only firestore \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      - name: Deploy Firebase Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          firebase deploy --only functions \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          # VITE vars are required here because firebase.json has a predeploy
          # hook ("pnpm --filter web build") that rebuilds the web app.
          # Without these, the predeploy rebuild bakes in `undefined` for all
          # VITE_FIREBASE_* values, causing auth/invalid-api-key in production.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          firebase deploy --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      - name: Deployment Summary
        run: |
          echo "## 🚀 Dev Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
